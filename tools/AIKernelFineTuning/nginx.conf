pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        # JSON APIs stay under the worker's 16 MiB buffered-body limit.
        client_max_body_size 13m;
        location = /datasets/file {
            # Raw JSONL is streamed, matching the worker's 512 MiB dataset limit.
            # Buffering is off so the 32 MiB gateway tmpfs does not have to hold the file.
            client_max_body_size 512m;
            proxy_request_buffering off;
            set $training_backend training-worker:8091;
            proxy_pass http://$training_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-NCF-Worker-Key $http_x_ncf_worker_key;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            proxy_next_upstream off;
        }
        location / {
            set $training_backend training-worker:8091;
            proxy_pass http://$training_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-NCF-Worker-Key $http_x_ncf_worker_key;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            proxy_next_upstream off;
        }
    }
}
